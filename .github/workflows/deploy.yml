# Compila la web (Astro) y la publica en GitHub Pages en cada subida a main.
# Requiere: Settings → Pages → Source: "GitHub Actions" (y repositorio público en el plan gratuito).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada 4 horas: vuelve a leer los contadores de visitas y republica la página /stats/
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Lee los contadores públicos de visitas (no necesita claves). Si falla, la compilación sigue con los últimos datos.
      - run: node scripts/fetch-stats.mjs
      - run: npm run build
        env:
          # La web vive en https://ajaspino.github.io/lopezlab/
          SITE_URL: https://ajaspino.github.io
          BASE_PATH: /lopezlab
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
